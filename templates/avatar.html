<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ByteBuddy Voice Chat</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--text-primary);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    :root {
      --bg-primary: rgba(18, 18, 18, 0.95);
      --bg-secondary: #1e1e1e;
      --accent: #bb86fc;
      --accent-light: #03dac6;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --user-bg: #2a2a2a;
      --assistant-bg: #2e2e2e;
    }
    .chat-container {
      display: grid;
      grid-template-rows: 1fr auto;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-primary);
    }
    .chat-history {
      position: relative;
      background-color: transparent;
      padding: 16px;
      overflow-y: auto;
    }
    #empty-placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      text-align: center;
      width: 100%;
    }
    #empty-placeholder img {
      max-width: 70%;
      height: auto;
      opacity: 0.15;
    }
    .message-item {
      display: flex;
      margin-bottom: 12px;
    }
    .message-item.user {
      flex-direction: row-reverse;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--bg-primary);
      flex-shrink: 0;
      overflow: hidden;
      cursor: pointer;
    }
    .message-item.assistant .avatar {
      background-color: var(--accent);
    }
    .message-item.user .message-content {
      margin-right: 16px;
    }
    .message-item.assistant .message-content {
      margin-left: 12px;
    }
    .message-content {
      max-width: 80%;
      display: flex;
      flex-direction: column;
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
    }
    .message-item.user .bubble {
      background-color: var(--user-bg);
      color: var(--text-primary);
      border-bottom-right-radius: 4px;
    }
    .message-item.assistant .bubble {
      background-color: var(--assistant-bg);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }
    .timestamp {
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      align-self: flex-end;
    }
    .chat-input-area {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-secondary);
      padding: 12px 16px;
      border-top: 1px solid #333;
    }
    #record-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #record-avatar.recording {
      transform: scale(1.1);
      background-color: var(--accent);
    }
    #record-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div id="chat-history" class="chat-history">
      <div id="empty-placeholder">
        <img src="/img/fondo.png" alt="Fondo del chat" />
      </div>
    </div>
    <div class="chat-input-area">
      <div id="record-avatar" class="avatar">
        🎤
      </div>
    </div>
  </div>

  <script>
    const chatHistory = document.getElementById("chat-history");
    const placeholder  = document.getElementById("empty-placeholder");
    const recordBtn    = document.getElementById("record-avatar");

    let mediaRecorder, audioChunks = [];

    function getCurrentTime() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function appendMessage(sender, text) {
      if (placeholder) placeholder.style.display = "none";

      const item = document.createElement("div");
      item.classList.add("message-item", sender);

      const avatar = document.createElement("div");
      avatar.classList.add("avatar");
      avatar.textContent = sender === "assistant" ? "" : "";
      if (sender === "assistant") {
        avatar.innerHTML = '<img src="/img/avatar_asistente.gif"/>';
      }

      const contentWrapper = document.createElement("div");
      contentWrapper.classList.add("message-content");

      const bubble = document.createElement("div");
      bubble.classList.add("bubble");
      bubble.textContent = text;

      const ts = document.createElement("div");
      ts.classList.add("timestamp");
      ts.textContent = getCurrentTime();

      contentWrapper.append(bubble, ts);
      item.append(avatar, contentWrapper);
      chatHistory.appendChild(item);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // arrancar grabación
    recordBtn.addEventListener("click", async () => {
      if (!mediaRecorder) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = onRecordingStop;
      }

      if (mediaRecorder.state === "inactive") {
        audioChunks = [];
        mediaRecorder.start();
        recordBtn.classList.add("recording");
      } else {
        mediaRecorder.stop();
        recordBtn.classList.remove("recording");
      }
    });

    // cuando termina la grabación
    async function onRecordingStop() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const form = new FormData();
      form.append('file', audioBlob, 'speech.webm');

      // 1) enviar a Whisper para transcribir
      const whisperRes = await fetch('/whisper', {
        method: 'POST',
        body: form
      });
      const { text: userText } = await whisperRes.json();
      appendMessage('user', userText);

      // 2) enviar transcripción al chat
      const chatRes = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: userText })
      });
      const { response: assistantText } = await chatRes.json();
      appendMessage('assistant', assistantText);

      // 3) usar Speech Synthesis para hablar
      const utter = new SpeechSynthesisUtterance(assistantText);
      speechSynthesis.speak(utter);
    }
  </script>
</body>
</html>
